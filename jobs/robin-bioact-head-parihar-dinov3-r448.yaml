apiVersion: batch/v1
kind: Job
metadata:
  name: robin-bioact-head-parihar-dinov3-r448
  namespace: b-r-singh1
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      securityContext:
        runAsUser: 1376
        runAsGroup: 1376
        fsGroup: 1376
      containers:
      - name: train
        image: abrainone/ai-linux:cu12.6.3-latest
        workingDir: /shared/ssd/home/b-r-singh1/bioactive
        command: ["bash", "-lc"]
        args:
        - |
          source /shared/ssd/home/b-r-singh1/venv/bin/activate
          for fold in 0 1 2 3 4 5; do
            echo "=== parihar dinov3 r448 fold $fold ==="
            python train_head.py --model dinov3 --res 448 --fold $fold --save_dir /shared/ssd/logs/b-r-singh1/parihar_rerun || exit 1
          done
        env:
        - { name: WANDB_MODE,      value: "disabled" }
        - { name: HF_HOME,         value: "/shared/ssd/home/b-r-singh1/.cache/huggingface" }
        - { name: PYTHONUNBUFFERED, value: "1" }
        resources:
          requests: { nvidia.com/gpu: 1, cpu: 4, memory: 16Gi }
          limits:   { nvidia.com/gpu: 1, cpu: 8, memory: 24Gi }
        volumeMounts:
        - { mountPath: /shared/ssd/home/b-r-singh1, name: home }
        - { mountPath: /shared/hdd/data/bioactive, name: data, readOnly: true }
        - { mountPath: /shared/ssd/logs/b-r-singh1, name: logs }
        - { mountPath: /shared/ssd/logs/b-b-parihar, name: parihar-logs, readOnly: true }
        - { mountPath: /dev/shm, name: dshm }
      volumes:
      - name: home
        hostPath: { path: /shared/ssd/home/b-r-singh1, type: Directory }
      - name: data
        hostPath: { path: /shared/hdd/data/bioactive, type: Directory }
      - name: logs
        hostPath: { path: /shared/ssd/logs/b-r-singh1, type: Directory }
      - name: parihar-logs
        hostPath: { path: /shared/ssd/logs/b-b-parihar, type: Directory }
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: 8Gi }
