apiVersion: batch/v1
kind: Job
metadata:
  name: robin-bioact-fluor102-celldino-r224
  namespace: b-r-singh1
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      securityContext:
        runAsUser: 1376
        runAsGroup: 1376
        fsGroup: 1376
      containers:
      - name: train
        image: abrainone/ai-linux:cu12.6.3-latest
        workingDir: /shared/ssd/home/b-r-singh1/bioactive
        command: ["bash", "-lc"]
        args:
        - |
          source /shared/ssd/home/b-r-singh1/venv/bin/activate
          for fold in 0 1 2 3 4 5; do
            echo "=== fluor102 celldino r224 fold $fold: extract embeddings ==="
            python extract_embeddings.py --params_path params/params_fluor102_celldino_cluster.json --model f102_celldino --res 224 --fold $fold || exit 1
            echo "=== fluor102 celldino r224 fold $fold: train head ==="
            python train_head.py --model f102_celldino --res 224 --fold $fold || exit 1
          done
        env:
        - { name: WANDB_MODE,      value: "disabled" }
        - { name: BIOACT_SAVE_DIR, value: "/shared/ssd/logs/b-r-singh1" }
        - { name: HF_HOME,         value: "/shared/ssd/home/b-r-singh1/hf_cache" }
        - { name: PYTHONUNBUFFERED, value: "1" }
        resources:
          requests: { nvidia.com/gpu: 1, cpu: 4, memory: 24Gi }
          limits:   { nvidia.com/gpu: 1, cpu: 8, memory: 32Gi }
        volumeMounts:
        - { mountPath: /shared/ssd/home/b-r-singh1, name: home }
        - { mountPath: /shared/hdd/data/bioactive, name: data, readOnly: true }
        - { mountPath: /shared/ssd/logs/b-r-singh1, name: logs }
        - { mountPath: /dev/shm, name: dshm }
      volumes:
      - name: home
        hostPath: { path: /shared/ssd/home/b-r-singh1, type: Directory }
      - name: data
        hostPath: { path: /shared/hdd/data/bioactive, type: Directory }
      - name: logs
        hostPath: { path: /shared/ssd/logs/b-r-singh1, type: Directory }
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: 8Gi }
