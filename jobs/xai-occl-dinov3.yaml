apiVersion: batch/v1
kind: Job
metadata:
  name: xai-occl-dinov3
  namespace: b-r-singh1
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      securityContext:
        runAsUser: 1376
        runAsGroup: 1376
        fsGroup: 1376
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - { key: kubernetes.io/hostname, operator: NotIn, values: ["w4-mi"] }
      containers:
      - name: train
        image: abrainone/ai-linux:cu12.6.3-latest
        workingDir: /shared/ssd/home/b-r-singh1/bioactive
        command: ["bash", "-lc"]
        args:
        - |
          source /shared/ssd/home/b-r-singh1/venv/bin/activate
          for f in 0 1 2 3 4; do METHOD=occlusion HEADSTEM=dinov3_r448 SCORE=logit TARGETS=/shared/ssd/logs/b-r-singh1/results/cv/resnet50_r224/gradcam_targets.csv python run_vitcx.py --params_path params/params_cluster_base.json --model f102_dinov3_base --res 448 --save_dir /shared/ssd/logs/b-r-singh1/xai_scratch --fold $f; done
        env:
        - { name: WANDB_MODE, value: "disabled" }
        - { name: BIOACT_SAVE_DIR, value: "/shared/ssd/logs/b-r-singh1" }
        - { name: HF_HOME, value: "/shared/ssd/home/b-r-singh1/hf_cache" }
        - { name: PYTHONUNBUFFERED, value: "1" }
        resources:
          requests: { nvidia.com/gpu: 1, cpu: 4, memory: 24Gi }
          limits:   { nvidia.com/gpu: 1, cpu: 8, memory: 32Gi }
        volumeMounts:
        - { mountPath: /shared/ssd/home/b-r-singh1, name: home }
        - { mountPath: /shared/hdd/data/bioactive, name: data, readOnly: true }
        - { mountPath: /shared/ssd/logs/b-r-singh1, name: logs }
        - { mountPath: /dev/shm, name: dshm }
      volumes:
      - name: home
        hostPath: { path: /shared/ssd/home/b-r-singh1, type: Directory }
      - name: data
        hostPath: { path: /shared/hdd/data/bioactive, type: Directory }
      - name: logs
        hostPath: { path: /shared/ssd/logs/b-r-singh1, type: Directory }
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: 8Gi }
